[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "med-monitor"
version = "0.1.0"
description = "Monitoramento multimodal de pacientes (vídeo, áudio, sinais vitais) com detecção de anomalias e Azure AI (Tech Challenge Fase 4 — FIAP Postech)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Otaviano Zibetti" }, { name = "Felipe Squarizi" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Cada modalidade tem seu extra: dá para trabalhar em uma sem instalar o peso das outras.
video = ["ultralytics>=8.3", "opencv-python-headless>=4.9"]
audio = [
    "azure-cognitiveservices-speech>=1.40",
    "azure-ai-textanalytics>=5.3",
    "librosa>=0.10",
    "soundfile>=0.12",
]
anomalias = ["scikit-learn>=1.4", "wfdb>=4.1"]
serving = ["fastapi>=0.115", "uvicorn>=0.30"]
dev = ["pytest>=7.4.0", "pytest-cov>=4.1.0", "httpx>=0.27", "jupyter>=1.0.0", "ipykernel>=6.0.0", "matplotlib>=3.8"]

[project.scripts]
med-monitor = "med_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
med_monitor = ["serving/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["med_monitor"]
