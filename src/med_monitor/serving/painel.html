<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel UTI — Santa Helena</title>
<style>
  :root {
    --bg: #0b0f14; --painel: #121820; --painel-2: #18202a; --borda: #233040;
    --texto: #e6edf3; --suave: #8b98a8; --fraco: #5b6878;
    --critico: #ff4d5e; --alto: #ff9f1c; --moderado: #f2d024; --informativo: #6f8fb0; --estavel: #2fd27a;
    --fc: #39e07a; --pa: #ff6b7a; --fr: #f5d547; --spo2: #4cc9f0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--texto); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .num { font-variant-numeric: tabular-nums; }

  header { display: flex; align-items: center; gap: 20px; padding: 12px 20px; border-bottom: 1px solid var(--borda); background: var(--painel); flex-wrap: wrap; }
  .marca { display: flex; flex-direction: column; }
  .marca b { font-size: 16px; letter-spacing: .2px; }
  .marca span { color: var(--suave); font-size: 12px; }
  .relogio { font-size: 28px; font-weight: 600; margin-left: auto; }
  .relogio small { display: block; font-size: 11px; font-weight: 400; color: var(--suave); text-align: right; }
  .controles { display: flex; gap: 8px; align-items: center; }
  .controles select, .controles input, button { background: var(--painel-2); color: var(--texto); border: 1px solid var(--borda); border-radius: 6px; padding: 6px 10px; font: inherit; }
  button { cursor: pointer; }
  button:hover { border-color: var(--suave); }
  button:disabled { opacity: .45; cursor: default; }
  button.primario { background: #1d6b45; border-color: #2a8f5e; }
  button.perigo { background: #5a1f27; border-color: #7d2a35; }
  .conexao { width: 8px; height: 8px; border-radius: 50%; background: var(--fraco); display: inline-block; margin-right: 6px; }
  .conexao.on { background: var(--estavel); }

  main { display: grid; grid-template-columns: minmax(0, 1fr) 420px; height: calc(100% - 66px); }
  @media (max-width: 1100px) { main { grid-template-columns: 1fr; height: auto; } }

  .leitos { padding: 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 14px; align-content: start; overflow: auto; }
  .leito { background: var(--painel); border: 1px solid var(--borda); border-radius: 10px; padding: 12px 14px; position: relative; }
  .leito[data-sev="moderado"] { border-color: color-mix(in srgb, var(--moderado) 45%, var(--borda)); }
  .leito[data-sev="alto"] { border-color: color-mix(in srgb, var(--alto) 70%, var(--borda)); }
  .leito[data-sev="critico"] { border-color: var(--critico); background: color-mix(in srgb, var(--critico) 8%, var(--painel)); }
  .leito.flash { animation: flash 1.2s ease-out 3; }
  @keyframes flash { 0% { background: #3a1820; } 100% { background: var(--painel); } }
  .leito-topo { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .leito-topo b { font-size: 18px; }
  .leito-topo .pid { color: var(--suave); font-size: 12px; margin-left: 8px; }
  .estado { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; padding: 2px 8px; border-radius: 999px; background: #173226; color: var(--estavel); }
  .estado[data-sev="moderado"] { background: #3a3510; color: var(--moderado); }
  .estado[data-sev="alto"] { background: #3d2a0e; color: var(--alto); }
  .estado[data-sev="critico"] { background: #43161d; color: var(--critico); }
  .estado[data-sev="aguardando"] { background: var(--painel-2); color: var(--suave); }

  .vitais { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .vital { background: var(--painel-2); border-radius: 8px; padding: 6px 8px; border: 1px solid transparent; }
  .vital .rot { font-size: 11px; color: var(--suave); display: flex; justify-content: space-between; }
  .vital .val { font-size: 26px; font-weight: 600; line-height: 1.1; }
  .vital .val small { font-size: 12px; font-weight: 400; color: var(--suave); }
  .vital.fc .val { color: var(--fc); } .vital.pa .val { color: var(--pa); } .vital.fr .val { color: var(--fr); } .vital.spo2 .val { color: var(--spo2); }
  .vital[data-pts="2"] { border-color: var(--alto); }
  .vital[data-pts="3"] { border-color: var(--critico); background: #2a1217; }
  .vital .val.vazio { color: var(--fraco); }
  .rodape-leito { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; color: var(--suave); font-size: 12px; }
  .news2 b { color: var(--texto); }
  canvas.spark { width: 100%; height: 34px; display: block; margin-top: 8px; }

  aside { border-left: 1px solid var(--borda); background: var(--painel); display: flex; flex-direction: column; min-height: 0; }
  .fila-topo { padding: 12px 16px; border-bottom: 1px solid var(--borda); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .fila-topo h2 { font-size: 14px; margin: 0; margin-right: auto; }
  .contagem { display: flex; gap: 6px; }
  .contagem span { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--painel-2); }
  .contagem .c-critico { color: var(--critico); } .contagem .c-alto { color: var(--alto); } .contagem .c-moderado { color: var(--moderado); }
  label.filtro { font-size: 12px; color: var(--suave); display: flex; gap: 4px; align-items: center; }
  .fila { overflow: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .vazio-fila { color: var(--fraco); text-align: center; padding: 40px 10px; }
  .alerta { background: var(--painel-2); border-radius: 8px; padding: 10px 12px; border: 1px solid transparent; }
  .alerta[data-sev="critico"] { border-color: var(--critico); background: color-mix(in srgb, var(--critico) 10%, var(--painel-2)); }
  .alerta[data-sev="alto"] { border-color: color-mix(in srgb, var(--alto) 55%, transparent); }
  .alerta.ciente { opacity: .55; }
  .alerta.novo { animation: entra .4s ease-out; }
  @keyframes entra { from { transform: translateX(16px); opacity: 0; } to { transform: none; opacity: 1; } }
  .alerta-topo { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--suave); }
  .sev { font-weight: 700; text-transform: uppercase; letter-spacing: .5px; font-size: 11px; display: inline-flex; align-items: center; gap: 6px; }
  .sev::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .sev.critico { color: var(--critico); } .sev.alto { color: var(--alto); } .sev.moderado { color: var(--moderado); } .sev.informativo { color: var(--informativo); }
  .alerta-topo .onde { color: var(--texto); font-weight: 600; }
  .alerta-topo .hora { margin-left: auto; }
  .msg { margin: 6px 0; }
  .alerta-rodape { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--suave); flex-wrap: wrap; }
  .chip { background: var(--bg); border: 1px solid var(--borda); border-radius: 999px; padding: 1px 8px; font-size: 11px; }
  .chip.mm { border-color: var(--spo2); color: var(--spo2); }
  .alerta-rodape button { margin-left: auto; padding: 3px 10px; font-size: 12px; }
  .reconhecido { margin-left: auto; color: var(--estavel); }
</style>
</head>
<body>
<header>
  <div class="marca">
    <b>Hospital Santa Helena · UTI Adulto</b>
    <span><i class="conexao" id="conexao"></i><span id="conexao-txt">desconectado</span> · monitoramento multimodal</span>
  </div>
  <div class="controles">
    <select id="velocidade" title="velocidade do replay">
      <option value="60">60× (1 min/s)</option>
      <option value="120" selected>120× (2 min/s)</option>
      <option value="300">300× (5 min/s)</option>
      <option value="600">600× (10 min/s)</option>
    </select>
    <button class="primario" id="iniciar">Iniciar plantão</button>
    <button class="perigo" id="parar">Parar</button>
    <input id="profissional" placeholder="Profissional (ex.: CRM-SP 111.222)" size="26">
  </div>
  <div class="relogio num" id="relogio">--:--<small id="relogio-sub">relógio do plantão</small></div>
</header>
<main>
  <section class="leitos" id="leitos"></section>
  <aside>
    <div class="fila-topo">
      <h2>Alertas para a equipe</h2>
      <div class="contagem num" title="alertas ainda sem ciência">
        <span class="c-critico" id="n-critico">0 crítico</span>
        <span class="c-alto" id="n-alto">0 alto</span>
        <span class="c-moderado" id="n-moderado">0 moderado</span>
      </div>
      <label class="filtro"><input type="checkbox" id="mostrar-info"> informativos</label>
    </div>
    <div class="fila" id="fila"><div class="vazio-fila" id="vazio">Nenhum alerta. Inicie o plantão para começar o monitoramento.</div></div>
  </aside>
</main>
<script>
const $ = (id) => document.getElementById(id);
const leitos = new Map();          // paciente_id → {el, hist}
const alertas = new Map();         // id → registro
const SEV_ROTULO = { critico: "crítico", alto: "alto", moderado: "moderado", informativo: "informativo" };
const MOD_ROTULO = { sinais_vitais: "sinais vitais", audio: "áudio", texto: "texto", video: "vídeo", movimentacao: "movimentação", prescricao: "prescrição" };

try { $("profissional").value = localStorage.getItem("profissional") || ""; } catch (e) {}
$("profissional").addEventListener("change", (e) => { try { localStorage.setItem("profissional", e.target.value); } catch (_) {} });

const hora = (iso) => iso ? new Date(iso).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit", timeZone: "UTC" }) : "--:--";
const fmt = (v) => v === null || v === undefined ? "—" : (Math.round(v) === v ? String(v) : v.toFixed(0));

function el(tag, attrs = {}, ...filhos) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v; else if (k === "text") n.textContent = v; else n.setAttribute(k, v);
  }
  for (const f of filhos) if (f) n.append(f);
  return n;
}

// ---------------------------------------------------------------- leitos
function criarLeito(e) {
  const card = el("article", { class: "leito", "data-sev": "estavel" });
  card.innerHTML = `
    <div class="leito-topo"><div><b></b><span class="pid"></span></div><span class="estado" data-sev="aguardando">aguardando</span></div>
    <div class="vitais">
      <div class="vital fc"><div class="rot"><span>FC</span><span>bpm</span></div><div class="val num">—</div></div>
      <div class="vital pa"><div class="rot"><span>PA</span><span>mmHg</span></div><div class="val num">—</div></div>
      <div class="vital fr"><div class="rot"><span>FR</span><span>irpm</span></div><div class="val num">—</div></div>
      <div class="vital spo2"><div class="rot"><span>SpO₂</span><span>%</span></div><div class="val num">—</div></div>
    </div>
    <canvas class="spark"></canvas>
    <div class="rodape-leito"><span class="news2">NEWS2 parcial <b class="num">—</b></span><span class="ep"></span></div>`;
  card.querySelector(".leito-topo b").textContent = e.leito;
  card.querySelector(".pid").textContent = e.paciente_id;
  const item = { el: card, hist: [] };
  leitos.set(e.paciente_id, item);
  const lista = [...leitos.values()].map(i => i.el).sort((a, b) => a.querySelector("b").textContent.localeCompare(b.querySelector("b").textContent));
  $("leitos").replaceChildren(...lista);
  return item;
}

function atualizarLeito(e) {
  const item = leitos.get(e.paciente_id) || criarLeito(e);
  const c = item.el, v = e.vitais || {}, pts = e.news2_pontos || {};
  const setVal = (cls, texto, p) => {
    const box = c.querySelector(`.vital.${cls}`);
    const val = box.querySelector(".val");
    val.textContent = texto; val.classList.toggle("vazio", texto === "—");
    box.dataset.pts = p ?? 0;
  };
  setVal("fc", fmt(v.fc), pts.fc);
  setVal("pa", v.pas == null ? "—" : `${fmt(v.pas)}/${fmt(v.pad)}`, pts.pas);
  setVal("fr", fmt(v.fr), pts.fr);
  setVal("spo2", fmt(v.spo2), pts.spo2);
  c.querySelector(".news2 b").textContent = e.news2_parcial ?? "—";

  const sev = e.status !== "monitorando" ? "aguardando" : (e.episodio && e.episodio.severidade) || "estavel";
  c.dataset.sev = sev;
  const badge = c.querySelector(".estado");
  badge.dataset.sev = sev;
  badge.textContent = e.status !== "monitorando" ? e.status : (sev === "estavel" ? "estável" : SEV_ROTULO[sev]);
  c.querySelector(".ep").textContent = e.episodio ? `episódio desde ${hora(e.episodio.inicio)}` : "";

  if (e.status === "monitorando") {
    item.hist.push([v.fc, v.spo2]);
    if (item.hist.length > 120) item.hist.shift();
    desenhar(c.querySelector("canvas"), item.hist);
  }
  if (e.momento) $("relogio").firstChild.textContent = hora(e.momento);
}

function desenhar(cv, hist) {
  const dpr = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
  if (cv.width !== w * dpr) { cv.width = w * dpr; cv.height = h * dpr; }
  const g = cv.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, w, h);
  const linha = (idx, cor, min, max) => {
    g.strokeStyle = cor; g.lineWidth = 1.5; g.beginPath(); let ok = false;
    hist.forEach((p, i) => {
      const val = p[idx]; if (val == null) { ok = false; return; }
      const x = (i / 119) * w, y = h - 2 - ((Math.min(Math.max(val, min), max) - min) / (max - min)) * (h - 4);
      ok ? g.lineTo(x, y) : g.moveTo(x, y); ok = true;
    });
    g.stroke();
  };
  const css = getComputedStyle(document.documentElement);
  linha(0, css.getPropertyValue("--fc"), 30, 180);
  linha(1, css.getPropertyValue("--spo2"), 75, 100);
}

// ---------------------------------------------------------------- alertas
function renderAlerta(a, novo) {
  const card = el("div", { class: "alerta" + (novo ? " novo" : ""), "data-sev": a.severidade, "data-id": a.id });
  const topo = el("div", { class: "alerta-topo" },
    el("span", { class: `sev ${a.severidade}`, text: SEV_ROTULO[a.severidade] }),
    el("span", { class: "onde", text: `${(a.contexto && a.contexto.leito) || ""} ${a.paciente_id}`.trim() }),
    el("span", { class: "hora num", text: hora(a.momento) }));
  const rodape = el("div", { class: "alerta-rodape" }, el("span", { text: `→ ${a.destinatario}` }));
  for (const m of a.modalidades) rodape.append(el("span", { class: "chip", text: MOD_ROTULO[m] || m }));
  if (a.multimodal) rodape.append(el("span", { class: "chip mm", text: "multimodal" }));
  rodape.append(el("span", { class: "chip", text: a.codigo }));
  if (a.reconhecido) {
    rodape.append(el("span", { class: "reconhecido", text: `ciente · ${a.reconhecido.profissional} · ${Math.round(a.reconhecido.segundos_ate_ciencia)} s` }));
    card.classList.add("ciente");
  } else {
    const b = el("button", { text: "Ciente" });
    b.onclick = () => reconhecer(a.id, b);
    rodape.append(b);
  }
  card.append(topo, el("div", { class: "msg", text: a.mensagem }), rodape);
  return card;
}

function inserirAlerta(a, novo) {
  alertas.set(a.id, a);
  $("vazio")?.remove();
  const card = renderAlerta(a, novo);
  if (a.severidade === "informativo" && !$("mostrar-info").checked) card.hidden = true;
  $("fila").prepend(card);
  if (novo && (a.severidade === "critico" || a.severidade === "alto")) {
    const l = leitos.get(a.paciente_id); if (l) { l.el.classList.remove("flash"); void l.el.offsetWidth; l.el.classList.add("flash"); }
  }
  contar();
}

function contar() {
  const n = { critico: 0, alto: 0, moderado: 0 };
  for (const a of alertas.values()) if (!a.reconhecido && a.severidade in n) n[a.severidade]++;
  $("n-critico").textContent = `${n.critico} crítico`;
  $("n-alto").textContent = `${n.alto} alto`;
  $("n-moderado").textContent = `${n.moderado} moderado`;
}

async function reconhecer(id, botao) {
  const profissional = $("profissional").value.trim();
  if (profissional.length < 3) { $("profissional").focus(); $("profissional").style.borderColor = "var(--critico)"; return; }
  $("profissional").style.borderColor = "";
  botao.disabled = true;
  const r = await fetch(`/alertas/${id}/ciente`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ profissional }) });
  if (!r.ok) botao.disabled = false;
}

function marcarCiente(rec) {
  const a = alertas.get(rec.id); if (!a) return;
  a.reconhecido = rec;
  const antigo = document.querySelector(`.alerta[data-id="${rec.id}"]`);
  if (antigo) antigo.replaceWith(renderAlerta(a, false));
  contar();
}

$("mostrar-info").addEventListener("change", (e) => {
  document.querySelectorAll('.alerta[data-sev="informativo"]').forEach(n => n.hidden = !e.target.checked);
});

// ---------------------------------------------------------------- controles
$("iniciar").onclick = async () => {
  await fetch("/simulacao/iniciar", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ velocidade: Number($("velocidade").value) }) });
};
$("parar").onclick = () => fetch("/simulacao/parar", { method: "POST" });

function estadoSimulacao(s) {
  $("relogio-sub").textContent = s.rodando ? `plantão em replay · ${s.velocidade}×` : "relógio do plantão · parado";
  $("iniciar").disabled = !!s.rodando;
}

// ---------------------------------------------------------------- stream
function conectar() {
  const es = new EventSource("/stream");
  es.onopen = () => { $("conexao").classList.add("on"); $("conexao-txt").textContent = "conectado"; };
  es.onerror = () => { $("conexao").classList.remove("on"); $("conexao-txt").textContent = "reconectando…"; };
  es.addEventListener("snapshot", (m) => {
    const d = JSON.parse(m.data);
    estadoSimulacao(d.simulacao);
    d.pacientes.forEach(atualizarLeito);
    $("fila").replaceChildren(); alertas.clear();
    if (!d.alertas.length) $("fila").append(el("div", { class: "vazio-fila", id: "vazio", text: "Nenhum alerta. Inicie o plantão para começar o monitoramento." }));
    [...d.alertas].reverse().forEach(a => inserirAlerta(a, false));
  });
  es.addEventListener("vitais", (m) => atualizarLeito(JSON.parse(m.data)));
  es.addEventListener("alerta", (m) => inserirAlerta(JSON.parse(m.data), true));
  es.addEventListener("reconhecimento", (m) => marcarCiente(JSON.parse(m.data)));
  es.addEventListener("simulacao", (m) => estadoSimulacao(JSON.parse(m.data)));
}
conectar();
</script>
</body>
</html>
